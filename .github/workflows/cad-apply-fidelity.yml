name: Apply verified CAD fidelity patch
on:
  push:
    branches: [fix/cad-render-fidelity]
    paths: [.github/workflows/cad-apply-fidelity.yml]
permissions:
  contents: write
jobs:
  apply-tested-patch:
    if: github.repository == 'Live-yan/thingsboard' && github.ref == 'refs/heads/fix/cad-render-fidelity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Validate and apply the exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '36585ac193db29a4a8c00d7c5ddc46da07a3c023'
          cat .github/cad-fidelity-parts/{1,2,3,4,5}.txt | base64 --decode | gzip --decompress > /tmp/cad-fidelity.patch
          echo '4d7f923cf7acbfdd61a15b5b79aada1acacae19acbf36fb9053203de150fa1a3  /tmp/cad-fidelity.patch' | sha256sum --check
          git apply --check --index /tmp/cad-fidelity.patch
          git apply --index /tmp/cad-fidelity.patch
          git rm -r .github/cad-fidelity-parts .github/workflows/cad-apply-fidelity.yml
          git diff --cached --check
          git config user.name 'CAD regression bot'
          git config user.email 'cad-regression@users.noreply.github.com'
          git commit -m 'fix(cad): preserve geometry precision, canvas policy and dashboard aspect ratio' -m 'Add analytic and independent renderer regressions, structured loss warnings and bounded hatch streaming. Remove temporary patch transport workflows.'
          git push origin HEAD:refs/heads/fix/cad-render-fidelity
