name: CAD background source snapshot
on:
  push:
    branches: [fix/cad-background-visibility]
    paths: [.github/workflows/cad-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/cad-review
          git archive --format=tar.gz HEAD .github/workflows ui-ngx/src ui-ngx/package.json ui-ngx/yarn.lock ui-ngx/tsconfig.json tests/cad application/src/main/data/scripts/cad application/src/main/java/org/thingsboard/server/service/entitiy/cad docs > /tmp/cad-review/source.tar.gz
          git rev-parse HEAD > /tmp/cad-review/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cad-background-source
          path: /tmp/cad-review/
          retention-days: 2
