name: CAD real DWG fixture
on:
  push:
    branches: [fix/cad-fonts-and-conversion-performance]
  pull_request:
    paths:
      - 'files/*.dwg'
      - 'application/src/main/data/scripts/cad/**'
      - 'tests/cad/**'
      - '.github/workflows/cad-dwg-fixture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dwg-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dwg-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve exact reproduction inputs (no fonts or executables)
        run: |
          mkdir -p cad-dwg-artifacts
          git rev-parse HEAD > cad-dwg-artifacts/revision.txt
          git archive --format=tar.gz HEAD > cad-dwg-artifacts/source.tar.gz
      - name: Build test-only LibreDWG 0.13.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://ftp.gnu.org/gnu/libredwg/libredwg-0.13.3.tar.xz -o "$RUNNER_TEMP/libredwg.tar.xz"
          tar -xf "$RUNNER_TEMP/libredwg.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libredwg-0.13.3"
          ./configure --disable-bindings --disable-shared --disable-write CFLAGS='-O1' > configure.log
          make -j2 > build.log 2>&1
          echo "$RUNNER_TEMP/libredwg-0.13.3/programs" >> "$GITHUB_PATH"
      - name: Inspect and convert the real DWG (not ODA equivalence)
        run: |
          set -euo pipefail
          python -m pip install ezdxf==1.4.4
          dwgread -O JSON -o cad-dwg-artifacts/source.json files/testfile.dwg
          dwg2dxf -o cad-dwg-artifacts/testfile.dxf files/testfile.dwg
          python - <<'PY'
          import cProfile, importlib.util, json, pstats, sys, time
          from collections import Counter
          from pathlib import Path
          import ezdxf
          out = Path('cad-dwg-artifacts')
          src = Path('application/src/main/data/scripts/cad').resolve()
          sys.path.insert(0, str(src))
          from cad_scene import convert_scene
          t = time.perf_counter()
          doc = ezdxf.readfile(out / 'testfile.dxf')
          report = {'decoder': 'LibreDWG 0.13.3 (test only, not ODA)',
                    'dwgBytes': Path('files/testfile.dwg').stat().st_size,
                    'dxfBytes': (out / 'testfile.dxf').stat().st_size,
                    'readSeconds': time.perf_counter() - t,
                    'modelspaceTypes': dict(Counter(e.dxftype() for e in doc.modelspace())),
                    'styles': [{'handle': s.dxf.handle, 'name': s.dxf.name, 'font': s.dxf.font} for s in doc.styles]}
          (out / 'inspection.json').write_text(json.dumps(report, indent=2))
          profiler = cProfile.Profile()
          t = time.perf_counter()
          profiler.runcall(convert_scene, out / 'testfile.dxf', out / 'scene', max_entities=50000)
          report['profiledSceneSeconds'] = time.perf_counter() - t
          (out / 'inspection.json').write_text(json.dumps(report, indent=2))
          with (out / 'profile.txt').open('w') as stream:
              pstats.Stats(profiler, stream=stream).sort_stats('cumulative').print_stats(70)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-real-dwg-evidence
          path: cad-dwg-artifacts/
          retention-days: 3
