name: Finalize CAD PR fixes
on:
  push:
    branches: [fix/cad-scene-deletion-parity]
    paths: [.github/workflows/cad-finalize-pr.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Live-yan/thingsboard' && github.ref == 'refs/heads/fix/cad-scene-deletion-parity' && github.actor == 'Live-yan'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact source fixes against the inspected PR revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          base = '89a71199923b5cb559e43a8455520af08beb995d'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/cad-finalize-pr.yml'], 'PR advanced after inspection'
          path = Path('ui-ngx/src/app/modules/home/components/dashboard-page/cad-import-dialog/cad-import-dialog.component.ts')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'ac413c9fa28fe7255f77896348708ee2c24c5e7c44759010eacf8da3a153e4ff'
          source = path.read_text()
          old = "      this.renderPreview();\n"
          assert source.count(old) == 1
          source = source.replace(old, '''      // Do not change template-bound loading state in the view-check hook.
                this.previewRendered = true;
                queueMicrotask(() => {
                  if (!this.viewDestroyed && this.step === 'preview') void this.renderPreview();
                });
          ''')
          # Dedent only the replacement; keep the repository's two-space indentation.
          source = source.replace('                this.previewRendered = true;', '      this.previewRendered = true;')
          source = source.replace('                queueMicrotask(() => {', '      queueMicrotask(() => {')
          source = source.replace("                  if (!this.viewDestroyed && this.step === 'preview') void this.renderPreview();", "        if (!this.viewDestroyed && this.step === 'preview') void this.renderPreview();")
          source = source.replace('                });\n', '      });\n')
          source = source.replace('  private previewRendered = false;', '  private previewRendered = false;\n  private viewDestroyed = false;')
          source = source.replace('  ngOnDestroy(): void {', '  ngOnDestroy(): void {\n    this.viewDestroyed = true;')
          path.write_text(source)
          config = Path('application/src/main/resources/thingsboard.yml')
          assert hashlib.sha256(config.read_bytes()).hexdigest() == '86efe2d204885843ecf7ac3a65214a8644f46c0ba8c85c4387c47b5293a60b38'
          text = config.read_text()
          start = text.index('\ncad:\n')
          end = text.index('\niot-hub:\n', start)
          block = text[start:end]
          descriptions = {
              'python-path': 'Python executable with the supported ezdxf runtime installed.',
              'script-path': 'Path to the CAD conversion entry point and its sibling scene module.',
              'conversion-timeout-seconds': 'Maximum wall-clock duration of one CAD conversion in seconds.',
              'max-file-size-mb': 'Maximum uploaded CAD size in MiB; align multipart and reverse-proxy limits.',
              'temp-dir': 'Tenant-scoped staging directory; provide disk capacity for concurrent conversions.',
              'max-entities': 'Maximum top-level CAD instances admitted to per-entity conversion.',
              'max-concurrent-conversions': 'Maximum active CAD conversions per service instance; excess requests receive HTTP 429.',
              'max-output-size-mb': 'Maximum total conversion output size in MiB before terminating the converter.'
          }
          for key, description in descriptions.items():
              old = '\n  ' + key + ':'
              assert block.count(old) == 1
              block = block.replace(old, '\n  # ' + description + old)
          config.write_text(text[:start] + block + text[end:])
          PY
          python3 tools/src/main/python/check_yml_file.py
          git diff --check
      - name: Commit only the two inspected source files to the PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/src/main/resources/thingsboard.yml ui-ngx/src/app/modules/home/components/dashboard-page/cad-import-dialog/cad-import-dialog.component.ts
          git commit -m 'fix(cad): document resource limits and defer preview work until after view checks'
          git push origin HEAD:refs/heads/fix/cad-scene-deletion-parity
