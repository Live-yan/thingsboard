name: CAD fidelity inspection inputs
on:
  push:
    branches: [fix/cad-render-fidelity]
    paths: [.github/workflows/cad-fidelity-inspection.yml]
permissions:
  contents: read
jobs:
  inspection-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact revision for reproducible local regressions
        run: |
          mkdir -p inspection
          git rev-parse HEAD > inspection/revision.txt
          git archive --format=tar.gz HEAD > inspection/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cad-fidelity-inspection-inputs
          path: inspection/
          retention-days: 1
