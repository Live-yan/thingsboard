name: CAD development inputs
on:
  push:
    branches: [feat/cad-editable-components]
    paths: [.github/workflows/cad-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p inputs
          git rev-parse HEAD > inputs/revision.txt
          git archive --format=tar.gz HEAD > inputs/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cad-development-inputs
          path: inputs/
          retention-days: 1
