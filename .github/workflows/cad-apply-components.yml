name: Apply verified CAD component source
on:
  push:
    branches: [feat/cad-editable-components]
    paths: [.github/workflows/cad-apply-components.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Live-yan/thingsboard' && github.ref == 'refs/heads/feat/cad-editable-components'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply verified source only; workflow changes are managed separately
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c932a7325c9343e24c4aa14c5b3752911af69a77'
          cat .github/cad-components-patch/{1,2,3,4,5}.txt | base64 --decode | gzip --decompress > /tmp/cad-components.patch
          echo '90d21e5496a183243b33220b5650d3977a76f18906b3663c0083b4f263402d6e  /tmp/cad-components.patch' | sha256sum --check
          git apply --check --index --exclude='.github/workflows/*' /tmp/cad-components.patch
          git apply --index --exclude='.github/workflows/*' /tmp/cad-components.patch
          git rm -r .github/cad-components-patch
          git diff --cached --check
          git config user.name 'CAD regression bot'
          git config user.email 'cad-regression@users.noreply.github.com'
          git commit -m 'feat(cad): export independent editable components and optional unmapped groups'
          git push origin HEAD:refs/heads/feat/cad-editable-components
